<meta name="theme-color" content="#1E1933" media="(prefers-color-scheme: dark)">

<style>
/* ==========================================================================
   Charte commune des applis — v1 (1er novembre 2026)
   À coller en haut du <style> de chaque index.html (pas de fichier externe :
   chaque appli reste un seul index.html). Voir charte.md pour les règles.
   Polices : copier design/fonts/ dans le dossier fonts/ de l'appli.
   ========================================================================== */

@font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('fonts/fredoka-latin.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 200 1000; font-display: swap; src: url('fonts/nunito-latin.woff2') format('woff2'); }

/* ---------- 1. Jetons (couleurs, formes, polices) ---------- */
:root {
  color-scheme: light dark;

  /* Fond et surfaces */
  --bg: #FFF4FA;            /* haut du dégradé de fond (rose très pâle) */
  --bg2: #EEF4FF;           /* bas du dégradé (bleu très pâle) */
  --surface: #FFFFFF;       /* cartes, bulles, boutons doux */
  --surface2: #F4F1FF;      /* touches du clavier, zones calmes */
  --track: #E4DEF7;         /* fond des barres de progression */

  /* Encre : même violet nuit que le contour des 30 personnages */
  --ink: #2B2340;           /* texte */
  --muted: #6B6190;         /* texte secondaire */
  --line: #2B2340;          /* contours et ombres dures */

  /* Rôles de couleur (un rôle = une couleur, dans toutes les applis) */
  --action: #3B5BFF;        /* LE bouton principal (Commencer, Valider, Suivant) */
  --on-action: #FFFFFF;
  --pompon: #FF6FA5;        /* rose de Pompon : cœurs, « Nouveau », bouton ▶ de l'accueil */
  --on-pompon: #FFFFFF;
  --sun: #FFD45C;           /* étoiles, récompenses, astuces, focus clavier */
  --on-sun: #2B2340;
  --good: #2BC48A;          /* bonne réponse, OK */
  --on-good: #0B2E20;
  --tint-good: #D8F6E8;     /* carte réussie */
  --retry: #FFB38A;         /* « à retenter » (jamais de rouge) */
  --tint-retry: #FFE4D6;    /* carte à retenter */

  /* 6 pastels (pastilles A-F, cartes de l'accueil, zones de carte) */
  --p-rose: #FFD2E3;
  --p-soleil: #FFE9A3;
  --p-menthe: #C6F1E2;
  --p-lilas: #E0D6FF;
  --p-ciel: #CDEBFF;
  --p-peche: #FFDCC8;

  /* 6 couleurs vives (icônes, personnages, confettis) */
  --v-rose: #FF6FA5;
  --v-soleil: #FFD45C;
  --v-menthe: #8EE3C8;
  --v-lilas: #C9B6FF;
  --v-ciel: #9AD7FF;
  --v-peche: #FFB38A;

  /* Lecture (applis de français) */
  --syl-a: #2F4FE0;         /* syllabes alternées : bleu… */
  --syl-b: #C92A62;         /* …et framboise */
  --muette: #A39DB8;        /* lettre muette grisée */
  --son-cle: #FFE9A3;       /* fond de la lettre qui décide du son */
  --ligne-b: #EEF1FF;       /* une ligne sur deux */

  /* Polices */
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;  /* titres, boutons, chiffres */
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; /* texte */
  --lecture: 'Nunito', Arial, sans-serif;                        /* texte à lire */

  /* Formes */
  --bord: 3px;
  --r-carte: 28px;
  --r-btn: 22px;
  --r-touche: 18px;
  --r-pastille: 999px;
  --ombre: 0 5px 0 var(--line);
  --ombre-carte: 0 6px 0 var(--line);
  --toucher: 56px;          /* hauteur mini d'un bouton */

  /* Mouvement */
  --ressort: cubic-bezier(.3, 1.6, .5, 1);
  --deco: .55;              /* opacité des petits dessins de fond */
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1933;
    --bg2: #171B36;
    --surface: #2B2448;
    --surface2: #352D57;
    --track: #3D3466;
    --ink: #FBEFFF;
    --muted: #C3B7E8;
    --line: #120E22;        /* le contour reste sombre, même la nuit */
    --action: #7F98FF;
    --on-action: #120E22;
    --pompon: #FF8DB9;
    --on-pompon: #2A0F1E;
    --good: #3DDC97;
    --tint-good: #1D4A3D;
    --retry: #FF9F7A;
    --tint-retry: #5A3326;
    --p-rose: #5A3552;
    --p-soleil: #5A4A24;
    --p-menthe: #24504A;
    --p-lilas: #433A72;
    --p-ciel: #283F68;
    --p-peche: #5A3A2E;
    --syl-a: #9DB0FF;
    --syl-b: #FF8DB4;
    --muette: #7D7499;
    --son-cle: #5A4A24;
    --ligne-b: #262046;
    --deco: .25;
  }
}

/* ---------- 2. Base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg2); }
body {
  margin: 0;
  min-height: 100dvh;
  background: linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%) no-repeat;
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; }
h1 { font-size: clamp(1.6rem, 7vw, 2.4rem); }
h2 { font-size: 1.4rem; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 3. En-tête commun : 🏠 · titre · ⚙ ---------- */
.entete { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.entete .titre { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.25rem; text-align: center; }
.rond {                    /* bouton rond (🏠, ⚙, ✕, son) */
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; font-size: 22px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: var(--bord) solid var(--line); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.rond:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- 4. Boutons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: var(--toucher); padding: 10px 22px;
  font: 600 1.2rem var(--display); text-decoration: none;
  color: var(--ink); background: var(--surface);
  border: var(--bord) solid var(--line); border-radius: var(--r-btn);
  box-shadow: var(--ombre); cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: var(--ombre); }
.btn-action { background: var(--action); color: var(--on-action); }   /* un seul par écran */
.btn-soleil { background: var(--sun); color: var(--on-sun); }         /* bonus, installer */
.btn-ok { background: var(--good); color: var(--on-good); }
.btn-petit { width: auto; min-height: 44px; padding: 6px 16px; font-size: 1rem; border-radius: var(--r-pastille); box-shadow: 0 4px 0 var(--line); }

/* ---------- 5. Cartes, bulles, pastilles ---------- */
.carte {
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-carte); box-shadow: var(--ombre-carte); padding: 20px;
}
.carte.reussie { background: var(--tint-good); }
.carte.a-retenter { background: var(--tint-retry); }
.bulle {                   /* bulle de dialogue d'un personnage */
  position: relative; background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: 26px; box-shadow: var(--ombre); padding: 12px 16px;
}
.pastille {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 12px;
  border: 2px solid var(--line); border-radius: var(--r-pastille);
  background: var(--surface); font: 700 .9rem var(--body); white-space: nowrap;
}
.pastille.soleil { background: var(--p-soleil); }
.pastille.rose { background: var(--p-rose); }
.pastille.menthe { background: var(--p-menthe); }
.badge-nouveau {
  display: inline-block; background: var(--sun); color: var(--on-sun);
  border: var(--bord) solid var(--line); border-radius: var(--r-pastille);
  padding: 1px 10px 2px; font: 700 .85rem var(--display); transform: rotate(4deg);
}
.etiquette { font: 800 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.astuce {
  background: var(--sun); color: var(--on-sun); border-radius: 18px;
  padding: 10px 14px; font-weight: 700;
}
.astuce::before { content: '💡 '; }

/* ---------- 6. Progression ---------- */
.barre { height: 18px; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); overflow: hidden; }
.barre > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: inherit; transition: width .4s var(--ressort); }

/* ---------- 7. Choix A-F (QCM) et clavier ---------- */
.choix {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--toucher);
  padding: 8px 14px; text-align: left; font: 600 1.1rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.choix:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choix .lettre {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center;
  border: 2px solid var(--line); border-radius: 10px; font-size: .9rem; background: var(--p-lilas);
}
.choix:nth-child(6n+1) .lettre { background: var(--p-rose); }
.choix:nth-child(6n+2) .lettre { background: var(--p-soleil); }
.choix:nth-child(6n+3) .lettre { background: var(--p-menthe); }
.choix:nth-child(6n+4) .lettre { background: var(--p-lilas); }
.choix:nth-child(6n+5) .lettre { background: var(--p-peche); }
.choix:nth-child(6n+6) .lettre { background: var(--p-ciel); }
.choix.bon { background: var(--tint-good); }
.choix.a-revoir { background: var(--tint-retry); }
.touche {
  min-height: 64px; font: 600 1.8rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.touche:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.touche.douce { background: var(--surface2); }
.touche.ok { background: var(--good); color: var(--on-good); }

/* ---------- 8. Réglages : interrupteur ---------- */
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--toucher); font-weight: 700; cursor: pointer; }
.interrupteur input { appearance: none; flex: none; width: 58px; height: 34px; margin: 0; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); position: relative; cursor: pointer; transition: background .2s; }
.interrupteur input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); transition: transform .2s var(--ressort); }
.interrupteur input:checked { background: var(--good); }
.interrupteur input:checked::after { transform: translateX(24px); }

/* ---------- 9. Texte à lire (applis de français) ---------- */
.texte-lecture {
  font-family: var(--lecture); font-size: 22px; font-weight: 600; line-height: 2;
  letter-spacing: .02em; word-spacing: .12em; max-width: 34ch;
}
.texte-lecture .ligne { display: block; padding: 0 10px; border-radius: 10px; }
.texte-lecture .ligne:nth-child(even) { background: var(--ligne-b); }
.syl-a { color: var(--syl-a); }
.syl-b { color: var(--syl-b); }
.muette { color: var(--muette); }
.son-cle { background: var(--son-cle); border-radius: 6px; box-shadow: 0 0 0 2px var(--son-cle); }

/* ---------- 10. Animations (désactivables) ---------- */
@keyframes apparait { from { transform: scale(.85); opacity: 0; } }
@keyframes bravo { 0% { transform: scale(1); } 30% { transform: scale(1.08) rotate(-2deg); } 55% { transform: scale(.97) rotate(1deg); } 80% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes non { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-10px) rotate(-3deg); } 40% { transform: translateX(9px) rotate(2.5deg); } 60% { transform: translateX(-6px) rotate(-1.5deg); } 80% { transform: translateX(3px) rotate(.5deg); } }
@keyframes saute { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 70% { transform: translateY(0) scale(1.06, .94); } 82% { transform: translateY(-10px) scale(.97, 1.03); } }
@keyframes flotte { 50% { transform: translateY(-12px) rotate(12deg); } }
@keyframes etoile { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx, 0), var(--dy, -80px)) scale(1) rotate(160deg); opacity: 0; } }
@keyframes arrive { 0% { transform: translateY(40px) scale(.6); opacity: 0; } 60% { transform: translateY(-8px) scale(1.05); opacity: 1; } 100% { transform: none; } }

.anim-apparait { animation: apparait .45s var(--ressort) both; }
.anim-bravo { animation: bravo .6s ease both; }          /* bonne réponse : la carte rebondit */
.anim-non { animation: non .5s ease both; }              /* erreur : la carte secoue la tête */
.anim-saute { animation: saute 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.anim-arrive { animation: arrive .7s var(--ressort) both; } /* entrée d'un personnage */

/* Petits dessins de fond ★ ♥ ✿ ✦ */
.deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--deco); }
.deco span { position: absolute; font-size: 22px; animation: flotte 7s ease-in-out infinite; }

/* Interrupteur « Animations » de l'appli : <html class="calme"> */
.calme *, .calme *::before, .calme *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ==========================================================================
   À vos plumes : styles propres à l'appli
   ========================================================================== */
[hidden] { display: none !important; }
.wrap { position: relative; z-index: 1; }
body.jeu .wrap { height: 100dvh; display: flex; flex-direction: column; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
body.jeu .entete { margin-bottom: 6px; }
body.jeu .entete .rond { width: 42px; height: 42px; font-size: 19px; }
body.jeu .deco { display: none; }
.vue { animation: apparait .35s var(--ressort) both; }
.pile { display: grid; gap: 14px; }
.centre { text-align: center; }
.muted { color: var(--muted); }
.petit { font-size: .95rem; }
p { margin: 0; }
.lien { background: none; border: 0; color: var(--muted); font-weight: 800; text-decoration: underline; cursor: pointer; padding: 10px; justify-self: center; min-height: 44px; font-family: var(--body); font-size: 1rem; }
.ligne-btn { display: flex; gap: 10px; }
.ligne-btn > .btn { flex: 1; }

/* ---------- Accueil ---------- */
.bonjour { font: 700 1.5rem var(--display); }
.sous-btn { text-align: center; color: var(--muted); font-weight: 800; margin-top: -6px; }
.tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tuile {
  position: relative; display: grid; gap: 4px; align-content: start; min-height: 104px; padding: 10px 12px 12px; text-align: left; cursor: pointer;
  border: var(--bord) solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); background: var(--p-ciel); color: var(--ink); font-family: var(--body);
}
.tuile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tuile .em { font-size: 26px; line-height: 1; }
.tuile .tt { font: 700 1.05rem/1.1 var(--display); }
.tuile .st { font-size: .82rem; font-weight: 800; color: var(--muted); }
.tuile .barre { height: 12px; border-width: 2px; margin-top: 2px; }
.tuile .conseil { position: absolute; top: -12px; right: -6px; }
.tuile:nth-child(4n+1) { background: var(--p-ciel); }
.tuile:nth-child(4n+2) { background: var(--p-lilas); }
.tuile:nth-child(4n+3) { background: var(--p-menthe); }
.tuile:nth-child(4n+4) { background: var(--p-soleil); }
.conseil { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; font: 800 .78rem var(--body); padding: 1px 8px; white-space: nowrap; color: var(--ink); }
.liste-textes { display: grid; gap: 10px; }
.carte-lien { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; color: var(--ink); padding: 12px 14px; font-family: var(--body); }
.carte-lien:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.carte-lien .em { font-size: 28px; flex: none; width: 36px; text-align: center; }
.carte-lien .tt { font: 700 1.1rem var(--display); display: block; }
.carte-lien .st { font-size: .88rem; color: var(--muted); font-weight: 700; display: block; }
.carte-lien .fin { margin-left: auto; flex: none; font-size: 1.05rem; white-space: nowrap; }
.num { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); background: var(--p-ciel); font: 700 1rem var(--display); }
.gpt { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); vertical-align: -2px; margin-right: 4px; }
.gpt.rouge { background: #FF8F8F; } .gpt.jaune { background: #FFD45C; } .gpt.vert { background: #7FD8A6; } .gpt.violet { background: #B79BFF; }

/* ---------- Fiche d'un texte ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 4px 0 6px; }
.seg button { min-height: 48px; font: 700 .95rem var(--display); color: var(--ink); background: var(--surface2); border: var(--bord) solid var(--line); border-radius: 14px; cursor: pointer; padding: 2px 4px; }
.seg button.on { background: var(--good); color: var(--on-good); }
.seg.groupes button.on { color: var(--ink); }
.seg.groupes button[data-g="rouge"].on { background: #FF8F8F; }
.seg.groupes button[data-g="jaune"].on { background: #FFD45C; }
.seg.groupes button[data-g="vert"].on { background: #7FD8A6; }
.seg.groupes button[data-g="violet"].on { background: #B79BFF; }
.reglage-titre { font-weight: 800; margin-top: 6px; }
.info-texte { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Écran de dictée ---------- */
body.jeu .vjeu { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.points { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; min-height: 12px; }
.points i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--track); }
.points i.fait { background: var(--good); }
.points i.rate { background: var(--retry); }
.points i.ici { background: var(--sun); transform: scale(1.25); }
.points i.rev { border-style: dashed; }
.ecoute { display: flex; gap: 8px; align-items: center; }
.ecoute .btn { width: auto; flex: 1; min-height: 46px; padding: 4px 10px; font-size: 1rem; border-radius: 16px; box-shadow: 0 3px 0 var(--line); }
.ecoute .btn:active { box-shadow: 0 1px 0 var(--line); }
.ecoute .ou { flex: none; font: 800 .85rem var(--body); color: var(--muted); min-width: 4.6em; text-align: center; line-height: 1.1; }
.zone {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative;
  background: var(--surface); border: var(--bord) solid var(--line); border-radius: var(--r-carte); box-shadow: var(--ombre-carte);
  padding: 12px 14px; display: flex; flex-direction: column;
}
.zin { margin: auto 0; display: flex; flex-direction: column; gap: 10px; }
.zone.reussie { background: var(--tint-good); }
.zone.a-retenter { background: var(--tint-retry); }
.consigne { font: 700 1.1rem/1.25 var(--display); text-align: center; }

.copie { font: 700 1.5rem/1.6 var(--lecture); word-break: break-word; cursor: text; min-height: 2.2em; letter-spacing: .02em; }

.copie .vide { color: var(--muted); font-weight: 600; font-size: 1.05rem; }
.caret { display: inline-block; width: 3px; height: 1.15em; background: var(--action); margin: 0 -1px; vertical-align: -.2em; animation: caret 1s steps(1) infinite; border-radius: 2px; }

.montre { background: var(--p-soleil); border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px; font: 700 1.35rem/1.5 var(--lecture); text-align: center; }

/* Dictée à trous */
.phrase-trous { font: 700 1.3rem/2 var(--lecture); }
.trou { display: inline-block; min-width: 3.2em; padding: 0 6px; border-bottom: 4px solid var(--action); border-radius: 8px 8px 0 0; cursor: pointer; line-height: 1.4; vertical-align: baseline; text-align: center; }
.trou.actif { background: var(--p-soleil); }
.trou.rempli { border-color: var(--good); }
/* Relecture */
.relue { font: 700 1.4rem/1.9 var(--lecture); }
.relue .m { border-radius: 8px; padding: 0 2px; }
.relue .m.allume { background: var(--sun); box-shadow: 0 0 0 3px var(--line); }
.relue .m.allume.vide { display: inline-block; min-width: 1.6em; border-bottom: 3px dashed var(--line); }
.question { background: var(--p-soleil); border: var(--bord) solid var(--line); border-radius: 18px; padding: 10px 12px; font: 700 1.05rem/1.3 var(--body); }
.question::before { content: '🔎 '; }

.score { font: 700 1.25rem var(--display); text-align: center; }
.corr { display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: flex-end; font-family: var(--lecture); }

.mc.ok { background: var(--p-menthe); }
.mc.faux { background: var(--p-peche); border-color: var(--line); }
.mc.oubli { background: var(--surface); border: 2px dashed var(--line); }
.mc.trop { background: var(--surface2); }
.mc.trop b { text-decoration: line-through; color: var(--muted); font-size: 1.1rem; }
.mc.ponct { padding: 2px 0; margin-left: -6px; }
.mc.el { margin-right: -4px; padding-right: 1px; }

.lf { border-radius: 5px; box-shadow: 0 0 0 2.5px var(--line); background: var(--sun); }
.expls { display: grid; gap: 6px; }

.expl .typ.maj { background: var(--p-ciel); }

.contexte { font: 700 1.45rem/1.6 var(--lecture); text-align: center; }

.phrase-q .t { display: inline-block; min-width: 3.5em; border-bottom: 4px solid var(--action); }
.choix-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choix-grille.trois { grid-template-columns: 1fr 1fr 1fr; }
.choix-grille .choix { justify-content: center; text-align: center; font: 800 1.2rem var(--lecture); min-height: 56px; padding: 6px 8px; }

.bas { flex: none; display: flex; flex-direction: column; gap: 8px; }
.kb { display: flex; flex-direction: column; gap: 5px; user-select: none; -webkit-user-select: none; }

.bas .btn { min-height: 52px; }

.hbar { height: 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--track); overflow: hidden; min-width: 60px; }

.mots-rates span { background: var(--p-peche); border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px; font: 700 1rem var(--lecture); }

dialog { border: var(--bord) solid var(--line); border-radius: var(--r-carte); box-shadow: var(--ombre-carte); background: var(--surface); color: var(--ink); padding: 18px; width: min(520px, calc(100% - 24px)); max-height: calc(100dvh - 24px); }

dialog h2 { margin-bottom: 8px; }
.sep { border: 0; border-top: 2px dashed var(--track); margin: 8px 0; }

textarea.champ { min-height: 160px; resize: vertical; line-height: 1.5; }

.zone.dense .score { font-size: 1.05rem; }
.zone.dense .corr { gap: 3px 4px; }
.zone.dense .mc { padding: 1px 4px; border-radius: 8px; }
.zone.dense .mc b { font-size: 1.08rem; }
.zone.dense .mc.neutre { padding-left: 1px; padding-right: 1px; }

.zone.dense .mc.el + .mc { padding-left: 1px; }

    var h = '<section class="carte recompense"><h2>' + (r.fini ? 'Texte fini ! 🎉' : 'Bravo, bien travaillé !') + '</h2><svg viewBox="0 0 100 100" id="fCreature" role="img"></svg>' +
      '<div class="etoiles">' + etoilesTxt(et) + '</div><p><b>' + justes + '</b> mots justes sur <b>' + total + '</b></p>' +
      (rev.length ? '<p class="muted">' + pluriel(rev.length, 'phrase') + ' revue' + (rev.length > 1 ? 's' : '') + ', ' + rev.filter(function (j) { return j.res.parfait; }).length + ' parfaite' + (rev.filter(function (j) { return j.res.parfait; }).length > 1 ? 's' : '') + '.</p>' : '') +
      (su ? '<p class="muted">« ' + esc(T.titre) + ' » : la suite demain (phrase ' + (su.i + 1) + ' sur ' + T.phrases.length + ').</p>' : '') +
      (r.rates.length ? '<p class="muted petit">' + pluriel(r.rates.length, 'phrase') + ' à revoir : elle' + (r.rates.length > 1 ? 's reviendront' : ' reviendra') + ' demain.</p>' : '') + '</section>';
    var prop = propositionNiveau();
    if (prop) h += '<section class="carte pile centre"><p><b>Tu réussis bien le niveau ' + J.niveau + ' !</b> On passe au niveau ' + (J.niveau + 1) + ' ?</p><div class="ligne-btn"><button class="btn" type="button" id="fPasEncore">Pas encore</button><button class="btn btn-ok" type="button" id="fOui">Oui !</button></div></section>';
    h += '<button class="btn btn-action" type="button" id="fAccueil">Retour à l\'accueil</button>';
    $('#vFin').innerHTML = h;
    montrer('vFin', 'Résultat');
    dessinCreature($('#fCreature'));
    son('fin'); pluieEtoiles(et * 3);
  }
  function propositionNiveau() {
    var n = J.niveau; if (n >= 4 || J.propose[n] === auj()) return false;
    return TEXTES.filter(function (t) { return t.niv === n && J.faits[t.id] && J.faits[t.id].pct >= 85; }).length >= 4;
  }

  /* ---------- Carnet du parent ---------- */
  function afficherParent() {
    var a = auj(), jours = [], i;
    for (i = 13; i >= 0; i--) { var d = plus(a, -i); jours.push('<i class="' + (J.jours[d] ? 'joue' : '') + '" title="' + d + '"></i>'); }
    function parFamille(n) {
      var c = { accords: 0, homophones: 0, mots: 0, decoupage: 0, oublis: 0 }, lim = plus(a, -n);
      J.erreurs.forEach(function (e) { if (e.d > lim) { var f = M.FAMILLES[e.t] || 'mots'; c[f]++; } });
      return c;
    }
    var c7 = parFamille(7), c30 = parFamille(30), max = Math.max(1, c30.accords, c30.homophones, c30.mots, c30.decoupage, c30.oublis);
    var NOMS = { accords: 'Accords et fins de verbes', homophones: 'Homophones (a/à, et/est…)', mots: 'Orthographe des mots', decoupage: 'Mots collés ou coupés', oublis: 'Mots oubliés ou en trop' };
    var faits = Object.keys(J.faits).filter(function (id) { return texteDe(id); }).sort(function (x, y) { return J.faits[x].d < J.faits[y].d ? 1 : -1; });
    var mr = [], vu = {};
    J.erreurs.slice().reverse().forEach(function (e) { if (['mot', 'liste', 'invariable', 'accent'].indexOf(e.t) >= 0 && e.a && !vu[M.norm(e.a)] && mr.length < 24) { vu[M.norm(e.a)] = 1; mr.push(e.a); } });
    var h = '<h2>Carnet du parent</h2>' +
      '<section class="carte pile"><div class="etiquette">14 derniers jours</div><div class="jours">' + jours.join('') + '</div><p class="muted petit">' + pluriel(Object.keys(J.jours).length, 'jour') + ' d\'entraînement en tout. ' + pluriel(enRevision(), 'phrase') + ' en révision, ' + aRevoir().length + ' à revoir aujourd\'hui.</p></section>' +
      '<section class="carte pile"><div class="etiquette">Erreurs par type</div><table class="stats"><tr><th></th><th class="n">7 j</th><th class="n">30 j</th><th></th></tr>' + Object.keys(NOMS).map(function (k) {
        return '<tr><td>' + NOMS[k] + '</td><td class="n">' + c7[k] + '</td><td class="n">' + c30[k] + '</td><td><div class="hbar"><i style="width:' + Math.round(100 * c30[k] / max) + '%"></i></div></td></tr>';
      }).join('') + '</table><p class="muted petit">Les accords et les fins de verbes sont les erreurs les plus fréquentes en CM2 : c\'est là que la relecture guidée aide le plus.</p></section>' +
      '<section class="carte pile"><div class="etiquette">Textes faits</div>' + (faits.length ? '<table class="stats">' + faits.slice(0, 12).map(function (id) {
        var f = J.faits[id]; return '<tr><td>' + esc(texteDe(id).titre) + '</td><td class="n">' + f.dernier + ' %</td><td class="n">' + etoilesTxt(f.etoiles) + '</td></tr>';
      }).join('') + '</table>' : '<p class="muted">Pas encore de texte fini.</p>') + '</section>' +
      '<section class="carte pile"><div class="etiquette">Mots ratés récemment</div>' + (mr.length ? '<div class="mots-rates">' + mr.map(function (w) { return '<span>' + esc(w) + '</span>'; }).join('') + '</div><button class="btn btn-petit" type="button" id="pCopierMots" style="justify-self:start">📋 Copier pour « Mots à retenir »</button>' : '<p class="muted">Aucun pour l\'instant.</p>') + '</section>' +
      '<section class="carte pile"><div class="etiquette">Mes textes</div><p class="muted petit">Ajoutez la dictée préparée de la classe, ou n\'importe quel texte.</p><button class="btn" type="button" id="pAjout">➕ Ajouter un texte</button></section>' +
      '<button class="btn" type="button" id="pCopier">📋 Copier le résumé</button><p class="centre muted petit" id="pCopie" hidden>Copié.</p>' +
      '<button class="btn btn-petit" type="button" id="pZero" style="justify-self:center">↺ Remettre à zéro</button>';
    $('#vParent').innerHTML = h;
    montrer('vParent', 'Carnet du parent');
  }
  function resume() {
    var faits = Object.keys(J.faits).filter(function (id) { return texteDe(id); });
    return 'À vos plumes, ' + auj() + '\n' + Object.keys(J.jours).length + ' jours d\'entraînement, ' + faits.length + ' textes finis.\n' +
      faits.map(function (id) { return '- ' + texteDe(id).titre + ' : ' + J.faits[id].dernier + ' %'; }).join('\n');
  }
  function copier(t) {
    var ok = function () { var x = $('#pCopie'); if (x) x.hidden = false; };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, function () { prompt('À copier :', t); }); else prompt('À copier :', t);
  }
  function ajouterTexte() {
    var titre = $('#aTitre').value.trim(), phr = M.phrasesLibres($('#aTexte').value);
    if (!titre || !phr.length) { $('#aErreur').hidden = false; return; }
    PERSO.push({ id: 'p' + Date.now().toString(36), titre: titre.slice(0, 60), phrases: phr.slice(0, 30) });
    sauver(); $('#dAjout').close(); afficherAccueil();
  }

  /* ---------- Réglages ---------- */
  function appliquerPrefs() { document.documentElement.classList.toggle('calme', !P.anim); }
  function ouvrirReglages() {
    ['son', 'anim', 'vibre', 'lente', 'prepa', 'relecture'].forEach(function (k) { $('#r' + k[0].toUpperCase() + k.slice(1)).checked = !!P[k]; });
    segs();
    $('#dReglages').showModal();
  }
  function segs() {
    document.querySelectorAll('#rGroupes button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === P.groupes); });
    document.querySelectorAll('#rDicte button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === P.dicte); });
    $('#rDicteAide').textContent = P.dicte === 'voix' ? (VOIX ? 'Voix trouvée : ' + VOIX.name + '.' : 'Aucune voix française trouvée sur cet appareil : on passe à « Je lis ».') :
      P.dicte === 'lire' ? 'Chaque groupe de mots s\'affiche, puis se cache quand tu écris.' : 'La phrase s\'affiche pour l\'adulte, qui la dicte à voix haute.';
  }

  /* ---------- Branchements ---------- */
  function retourAccueil() { RUN = null; Q = null; PREP = null; taire(); afficherAccueil(); }
  function retour() {
    if (VUE === 'vTexte' && FICHE) { var t = texteDe(FICHE.tid); if (t && t.sorte === 'niveau') return afficherNiveau(t.niv); }
    retourAccueil();
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('#jCopie') && Q && (Q.phase === 'ecrire' || Q.phase === 'edit')) return placerCurseur(e);
    var b = e.target.closest('button, [data-trou]');
    if (!b || b.disabled) return;
    var d = b.dataset, id = b.id;
    if (d.k != null) return taper(d.k);
    if (d.trou != null) { if (Q && (Q.phase === 'ecrire' || Q.phase === 'edit')) { Q.th = +d.trou; rendreQ(); if (dicteur() === 'voix') dire([groupeDuTrou()]); } return; }
    if (d.pchoix != null) return choisirPrep(+d.pchoix);
    if (d.niveau) return afficherNiveau(+d.niveau);
    if (d.texte) { FICHE = null; return afficherTexte(d.texte); }
    if (d.g && FICHE) { var T = texteDe(FICHE.tid); GE[T.n] = d.g; sauver(); FICHE.mode = d.g === 'rouge' ? 'trous' : 'entiere'; return afficherTexte(FICHE.tid); }
    if (d.mode && FICHE) { FICHE.mode = d.mode; return afficherTexte(FICHE.tid); }
    if (d.v && b.parentNode.id === 'rGroupes') { P.groupes = d.v; sauverPrefs(); return segs(); }
    if (d.v && b.parentNode.id === 'rDicte') { P.dicte = d.v; sauverPrefs(); return segs(); }
    switch (id) {
      case 'bJour': return lancerJour();
      case 'bParent': return afficherParent();
      case 'bRetour': return retour();
      case 'bReglages': return ouvrirReglages();
      case 'rFermer': $('#dReglages').close(); if (VUE === 'vAccueil') afficherAccueil(); else if (VUE === 'vJeu' && Q) rendreQ(); return;
      case 'tGo': { var su = J.suite[FICHE.tid]; return lancerTexte(FICHE.tid, FICHE.mode, su && su.i < texteDe(FICHE.tid).phrases.length ? su.i : 0); }
      case 'tDebut': delete J.suite[FICHE.tid]; sauver(); return lancerTexte(FICHE.tid, FICHE.mode, 0);
      case 'tSuppr':
        if (!confirm('Supprimer ce texte ?')) return;
        PERSO = PERSO.filter(function (t) { return t.id !== FICHE.tid; }); delete J.suite[FICHE.tid]; sauver(); return retourAccueil();
      case 'pEcoute': return dire(PREP.phs.map(function (p) { return p.ph.texte; }));
      case 'pPret': return suivantPrep();
      case 'pSuivant': return suivantPrep();
      case 'jRe': return dire([Q.mode === 'trous' ? groupeDuTrou() : Q.gs[Q.g].texte]);
      case 'jTout': return dire([Q.ph.texte]);
      case 'jRevoir': Q.vu = true; return rendreQ();
      case 'jSuite': return suite();
      case 'jBon': Q.rel.k++; return finRelecture();
      case 'jCorrige': return corrigerMot();
      case 'jApres': return apresCorrection();
      case 'jEnTete': Q.reec[Q.rk].etape = 'ecrire'; return rendreQ();
      case 'jValMot': return validerMot();
      case 'jMotSuivant': return motSuivant();
      case 'fAccueil': return retourAccueil();
      case 'fOui': J.niveau = Math.min(4, J.niveau + 1); sauver(); b.closest('section').innerHTML = '<p><b>C\'est parti pour le niveau ' + J.niveau + ' !</b></p>'; return;
      case 'fPasEncore': J.propose[J.niveau] = auj(); sauver(); b.closest('section').remove(); return;
      case 'pCopierMots': { var l = Array.from(document.querySelectorAll('.mots-rates span')).map(function (x) { return x.textContent; }); return copier(l.join('\n')); }
      case 'pCopier': return copier(resume());
      case 'pAjout': $('#aTitre').value = ''; $('#aTexte').value = ''; $('#aErreur').hidden = true; return $('#dAjout').showModal();
      case 'aAnnuler': return $('#dAjout').close();
      case 'aOk': return ajouterTexte();
      case 'pZero':
        if (!confirm('Effacer tous les progrès de cet appareil ? (Les textes ajoutés sont gardés.)')) return;
        F = {}; J = { jours: {}, faits: {}, erreurs: [], niveau: 1, propose: {}, suite: {} }; sauver(); return retourAccueil();
    }
  });
  ['son', 'anim', 'vibre', 'lente', 'prepa', 'relecture'].forEach(function (k) {
    $('#r' + k[0].toUpperCase() + k.slice(1)).addEventListener('change', function (e) { P[k] = e.target.checked; sauverPrefs(); appliquerPrefs(); });
  });
  // Clavier physique (ordinateur, tablette avec clavier)
  document.addEventListener('keydown', function (e) {
    if (VUE !== 'vJeu' || !Q || e.ctrlKey || e.metaKey || e.altKey || $('#dReglages').open || $('#dAjout').open) return;
    var ecrit = Q.phase === 'ecrire' || Q.phase === 'edit' || (Q.phase === 'reec' && Q.reec[Q.rk].etape === 'ecrire');
    if (!ecrit) return;
    if (e.key === 'Backspace') { e.preventDefault(); taper('del'); }
    else if (e.key === 'ArrowLeft' && Q.phase !== 'reec' && Q.mode !== 'trous') { e.preventDefault(); Q.caret = Math.max(0, Q.caret - 1); rendreQ(); }
    else if (e.key === 'ArrowRight' && Q.phase !== 'reec' && Q.mode !== 'trous') { e.preventDefault(); Q.caret = Math.min(Array.from(Q.tape).length, Q.caret + 1); rendreQ(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (Q.phase === 'reec') validerMot(); else suite(); }
    else if (e.key.length === 1 && /[\p{L}' ’-]/u.test(e.key)) { e.preventDefault(); taper(e.key === '’' ? "'" : e.key.toLowerCase()); }

  document.addEventListener('visibilitychange', function () { if (document.hidden) taire(); });

  /* ---------- Touche qui s'éclaire quand on appuie (écran ou clavier physique) ---------- */
  // Le clavier peut être redessiné à chaque lettre : on retrouve la touche par son data-k.
  function toucheVisible(k) {
    return Array.prototype.find.call(document.querySelectorAll('#kb [data-k]'), function (b) {
      return b.getAttribute('data-k') === k && b.getClientRects().length;
    });
  }
  function eclaireTouche(b) {
    if (!b) return;
    b.classList.remove('allume'); void b.offsetWidth; b.classList.add('allume');
    clearTimeout(b._allume);
    b._allume = setTimeout(function () { b.classList.remove('allume'); }, 300);
  }
  var toucheAppuyee = null;
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('#kb [data-k]');
    toucheAppuyee = b;
    if (b && !b.disabled) eclaireTouche(b);
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('#kb [data-k]'), k = b ? b.getAttribute('data-k') : null;
    if (k == null && toucheAppuyee && !toucheAppuyee.isConnected) k = toucheAppuyee.getAttribute('data-k');
    if (k == null) return;
    // Clic au clavier (Entrée sur la touche) ou touche redessinée : on rallume la bonne.
    var v = toucheVisible(k);
    if (v && v !== toucheAppuyee) eclaireTouche(v);
    toucheAppuyee = null;
  });
  document.addEventListener('keydown', function (e) {
    if (!e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key === 'Backspace' ? 'del' : e.key === '’' ? "'" : e.key.length === 1 ? e.key.toLowerCase() : null;
    if (k != null) eclaireTouche(toucheVisible(k));
  });

  /* ---------- Démarrage ---------- */
  appliquerPrefs();
  afficherAccueil();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne indisponible */ });

  // Crochet pour les tests automatiques
  window.__plumes = {
    M: M, TEXTES: TEXTES, ECOLE: ECOLE,
    etat: function () {
      return { vue: VUE, dicteur: dicteur(), prep: PREP && { k: PREP.k, n: PREP.qs.length, ok: PREP.ok },
        q: Q && { tid: Q.job.tid, i: Q.job.i, rev: !!Q.job.rev, mode: Q.mode, phase: Q.phase, attendu: Q.ph.texte, tape: Q.tape, ttape: Q.ttape, g: Q.g, ng: Q.gs.length,
          trous: Q.trous.map(function (p) { return p.mot; }), rel: Q.rel && Q.rel.k, nrel: Q.rel && Q.rel.liste.length, res: Q.res && { justes: Q.res.justes, total: Q.res.total, parfait: Q.res.parfait, types: (Q.errs || []).map(function (e) { return e.type; }) },
          reec: Q.reec && Q.reec.length, rk: Q.rk, etape: Q.reec && Q.reec[Q.rk] && Q.reec[Q.rk].etape },
        run: RUN && { k: RUN.k, n: RUN.jobs.length, jobs: RUN.jobs.map(function (j) { return j.tid + '#' + j.i + (j.rev ? 'r' : ''); }) } };
    },
    // Joue l'étape en cours comme un enfant qui ne se trompe pas.
    juste: function () {
      if (VUE === 'vJeu' && PREP) {
        if (PREP.k < 0 || PREP.ok || PREP.rates.length >= 2) return suivantPrep();
        var q = PREP.qs[PREP.k]; return choisirPrep(q.choix.indexOf(q.p.mot));
      }
      if (VUE !== 'vJeu' || !Q) return;
      var p = Q.phase;
      if (p === 'ecrire' || p === 'edit') {
        if (Q.mode === 'trous') { Q.ttape = Q.trous.map(function (x) { return x.mot.toLowerCase(); }); Q.th = Q.trous.length - 1; }
        else { Q.tape = Q.ph.texte.toLowerCase(); Q.caret = Array.from(Q.tape).length; Q.g = Q.gs.length - 1; }
        return finPhrase();
      }
      if (p === 'relire') { Q.rel.k++; return finRelecture(); }
      if (p === 'corr') return apresCorrection();
      if (p === 'reec') {
        var it = Q.reec[Q.rk];
        if (it.etape === 'voir') { it.etape = 'ecrire'; return rendreQ(); }
        if (it.etape === 'ecrire') { it.tape = it.mot.toLowerCase(); return validerMot(); }
        return motSuivant();
      }
    },
    // Écrit la phrase avec des erreurs (un piège sur deux remplacé par une graphie proche, ou tronqué).
    ecrireFaux: function (texte) {
      if (!Q) return;
      if (texte != null) { Q.tape = texte; Q.caret = Array.from(texte).length; Q.g = Q.gs.length - 1; return finPhrase(); }
      if (Q.mode === 'trous') { Q.ttape = Q.trous.map(function (x, k) { return k % 2 ? x.mot : (M.variantes(x)[0] || x.mot + 's'); }); Q.th = Q.trous.length - 1; return finPhrase(); }
      var t = Q.ph.texte, l = Q.ph.pieges.slice().reverse();
      l.forEach(function (x, k) { if (k % 2 === 0) t = t.slice(0, x.debut) + (M.variantes(x)[0] || x.mot + 's') + t.slice(x.fin); });
      Q.tape = t; Q.caret = Array.from(t).length; Q.g = Q.gs.length - 1;
      finPhrase();
    },
    taper: function (s) { Array.from(s).forEach(function (c) { taper(c); }); },
    // debut : numéro de phrase, ou 'longue' pour la phrase la plus longue du texte
    lancer: function (tid, mode, debut, max) {
      FICHE = null;
      if (debut === 'longue') { var T = texteDe(tid), L = -1; T.phrases.forEach(function (p, k) { if (L < 0 || p.ph.texte.length > T.phrases[L].ph.texte.length) L = k; }); debut = L; }
      lancerTexte(tid, mode || 'entiere', debut || 0, max);
    },
    prepFaux: function () { var q = PREP && PREP.qs[PREP.k]; if (q) choisirPrep(q.choix.findIndex(function (c) { return c !== q.p.mot; })); },
    jour: lancerJour,
    plan: function () { var p = planDuJour(); return { rev: p.rev, tid: p.tid, debut: p.debut, n: p.n }; },
    jours: function (n) { DECALAGE = n; if (VUE === 'vAccueil') afficherAccueil(); },
    fiches: function () { return JSON.parse(JSON.stringify(F)); },
    journal: function () { return JSON.parse(JSON.stringify(J)); },
    aller: function (v, x) { ({ accueil: afficherAccueil, parent: afficherParent, niveau: function () { afficherNiveau(x || 1); }, texte: function () { FICHE = null; afficherTexte(x); } })[v](); },
    accueil: retourAccueil
  };
})();
